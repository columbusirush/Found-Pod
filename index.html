button,input,textarea {font:inherit;}

button:focus-visible,a:focus-visible {

.wrap {

header {

.status {

footer {

.top-link {
  display:inline-block;

@media(max-width:700px) {

  }

  .grid,.contact-grid,.manifesto {
    grid-template-columns:1fr;
  }

  section {padding:56px 0;}

  .card {padding:22px;}
